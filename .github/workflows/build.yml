name: build

# Fork build: AeroSpace v0.21.3-Beta with the focus-follows-mouse fixes.
# Runs on push to rr/** ("remote run") branches only and uploads the release zip as an artifact.

on:
  push:
    branches:
      - 'rr/**' # "rr" stands for "remote run"
  workflow_dispatch:

jobs:

  build-debug:
    strategy:
      matrix:
        os: [macos-26]
    name: build-debug
    runs-on: ${{ matrix.os }}
    steps:
      - run: env # Debug
      - uses: actions/checkout@v6
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew install swiftly bash
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install
      - run: swiftly run swift --version
      - run: ./build-debug.sh
      - run: ./test.sh

  build-release:
    strategy:
      matrix:
        os: [macos-26]
    name: build-release
    runs-on: ${{ matrix.os }}
    steps:
      - run: env # Debug
      - uses: actions/checkout@v6
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew install bash fish xcbeautify swiftly
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install
      - run: swiftly run swift --version
      - name: './build-release.sh'
        run: |
          # "-" means "Sign to run locally". There is no aerospace-codesign-certificate on GH Actions
          ./build-release.sh --build-version 0.21.3-Beta-ffm --codesign-identity -
      - uses: actions/upload-artifact@v4
        with:
          name: AeroSpace-v0.21.3-Beta-ffm
          path: .release/AeroSpace-v0.21.3-Beta-ffm.zip
          if-no-files-found: error
      - name: cat ./.release/xcodebuild.log
        if: ${{ always() }}
        run: 'if test -f ./.release/xcodebuild.log; then cat ./.release/xcodebuild.log; fi'
